services:
  # Web application
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_TERMINAL_WS_URL=ws://localhost:8080
    depends_on:
      - terminal

  # Terminal WebSocket server
  terminal-ws:
    build:
      context: .
      dockerfile: Dockerfile.web
    command: npm run terminal-server
    ports:
      - "8080:8080"
    environment:
      - TERMINAL_HOST=terminal
      - TERMINAL_PORT=22
      - TERMINAL_USER=student
      - TERMINAL_PASSWORD=perfquest
    depends_on:
      - terminal

  # Linux environment for students
  terminal:
    build:
      context: ./server/docker
      dockerfile: Dockerfile
    privileged: true
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
      - PERFMON
    security_opt:
      - seccomp:unconfined
    ports:
      - "2222:22"
    tmpfs:
      - /tmp:size=512M
